<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Identity Card Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body data-page="login">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Header with Logo and Title -->
      <div class="auth-header">
        <svg class="auth-logo" viewBox="0 0 64 64" role="img" aria-label="Verified digital identity card">
          <defs>
            <filter id="id-card-glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="2" result="glow"/>
              <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#id-card-glow)">
            <rect x="7" y="9" width="45" height="36" rx="7" fill="#201a2b" stroke="#9b7be8" stroke-width="2"/>
            <circle cx="20" cy="21" r="5" fill="#f4f1fb"/>
            <path d="M12.5 36c.8-5 3.5-7.5 7.5-7.5s6.7 2.5 7.5 7.5" fill="#f4f1fb"/>
            <path d="M33 20h12M33 26h10M33 32h7" stroke="#eee9f8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          </g>
          <circle cx="47" cy="46" r="11" fill="#10b981" stroke="#17221e" stroke-width="2"/>
          <path d="m41.5 46 3.6 3.6 7.2-7.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="auth-brand">Digital Identity Card Generator</p>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage and generate official digital ID badges</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <!-- Username or Email -->
        <div class="form-group">
          <label class="form-label" for="identifier">
            Username or Email <span class="required">*</span>
          </label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input 
              type="text" 
              id="identifier" 
              name="identifier" 
              class="form-control" 
              placeholder="Enter your username or email"
              autocomplete="username"
              required
            >
          </div>
          <div class="form-help"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">
            Password <span class="required">*</span>
          </label>
          <div class="input-container">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-pwd" id="togglePassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="form-help"></div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="auth-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember Me</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="auth-forgot-link">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Sign In to Dashboard
        </button>

        <div class="login-divider" aria-label="Or continue with">
          <span>OR CONTINUE WITH</span>
        </div>

        <button type="button" class="google-login-button">
          <svg class="google-login-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.57-5.17 3.57-8.85z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.92l-3.87-3c-1.08.72-2.46 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.25v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.25 14.26a7.2 7.2 0 0 1 0-4.52v-3.1H1.25a12 12 0 0 0 0 10.72l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.77c1.77 0 3.36.61 4.61 1.81l3.45-3.45C17.95 1.17 15.24 0 12 0A12 12 0 0 0 1.25 6.64l4 3.1c.95-2.85 3.61-4.97 6.75-4.97z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
